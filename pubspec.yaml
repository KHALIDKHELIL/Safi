name: safi
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
    
  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_storage: ^13.6.0
  flutter_riverpod: ^3.4.3
  image_picker: ^1.2.3
  audioplayers: ^6.8.1
  url_launcher: ^6.3.3
  flutter_local_notifications: 17.0.0
  uuid: ^4.6.0
  intl: ^0.20.3
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  timezone: 0.9.4
  pdf: ^3.13.1
  printing: ^5.15.1
  local_auth: ^3.0.2
  http: ^1.6.0
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

# 1. Launcher Icon Setup
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21

# 2. Splash / Boot Screen Setup
flutter_native_splash:
  color: "#1e1e2e"
  image: "assets/logo.png"
  android: true
  ios: true

# The main Flutter block for material design and bundled files
flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/